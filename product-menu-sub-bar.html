<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Menu - FRALEN CRM</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #eef1f6;
    margin: 0;
    padding: 24px 16px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* Top header bar - matches FRALEN CRM navy header */
  .header {
    background: #1b2a6b;
    border-radius: 10px 10px 0 0;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header .logo {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    color: #ffffff;
  }
  .header .logo .accent { color: #6f8cff; }
  .header .back {
    background: #2f3f8a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  /* Section title */
  .section-title {
    background: #ffffff;
    padding: 18px 20px 14px 20px;
    font-size: 22px;
    font-weight: 800;
    color: #1b2a6b;
    border-bottom: 3px solid #3b57e0;
  }

  /* Products main toggle - full width bold bar */
  .products-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1b2a6b;
    color: #ffffff;
    border: none;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .products-toggle .chev { transition: transform 0.2s; }
  .products-toggle .chev.closed { transform: rotate(-90deg); }

  /* Horizontal sub-bar row - pill tabs like Add Purchase / Purchase History / Return */
  .subbar {
    display: none;
    gap: 10px;
    padding: 14px;
    background: #eef1f6;
    overflow-x: auto;
    flex-wrap: nowrap;
  }
  .subbar.open { display: flex; }

  .tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 2px solid #c7d0e8;
    background: #ffffff;
    color: #1b2a6b;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tab .emoji { font-size: 16px; }
  .tab:hover { border-color: #3b57e0; }
  .tab.active {
    background: #1b2a6b;
    color: #ffffff;
    border-color: #1b2a6b;
  }

  /* Categories row - appears below main tabs when Categories tab is active */
  .cat-row {
    display: none;
    gap: 10px;
    padding: 4px 14px 14px 14px;
    background: #eef1f6;
    overflow-x: auto;
  }
  .cat-row.open { display: flex; }

  .cat-tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid #d7deef;
    background: #ffffff;
    color: #3a4a8a;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-tab.active {
    background: #3b57e0;
    color: #ffffff;
    border-color: #3b57e0;
  }

  .footer-space { height: 10px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
  <div class="logo">FRALEN <span class="accent">EN</span> CRM</div>

  <button class="back" onclick="window.location.href='dashboard.html'">
    &larr; Back
  </button>
  </div>

  <div class="section-title">Products</div>

  <!-- Products main toggle -->
  <button class="products-toggle" id="productsToggle" onclick="toggleProducts()">
    <span>PRODUCTS MENU</span>
    <svg class="chev open" id="productsChev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <!-- Horizontal sub-bar (Product List / Add Product / Categories / Brands / Product Details) -->
  <div class="subbar open" id="productsSubbar">
    <button class="tab active" onclick="setActive(this,'Product List')">
      <span class="emoji">📋</span> Product List
    </button>
    <button class="tab" onclick="setActive(this,'Add Product')">
      <span class="emoji">➕</span> Add Product
    </button>
    <button class="tab" id="categoriesTab" onclick="toggleCategories(this)">
      <span class="emoji">🗂️</span> Categories
    </button>
    <button class="tab" onclick="setActive(this,'Brands')">
      <span class="emoji">🏷️</span> Brands
    </button>
    <button class="tab" onclick="setActive(this,'Product Details')">
      <span class="emoji">📄</span> Product Details
    </button>
  </div>

  <!-- Categories horizontal row -->
  <div class="cat-row" id="categoriesRow">
    <button class="cat-tab active" onclick="setCatActive(this,'Frames')">👓 Frames</button>
    <button class="cat-tab" onclick="setCatActive(this,'Lenses')">🔷 Lenses</button>
    <button class="cat-tab" onclick="setCatActive(this,'Contact Lenses')">👁️ Contact Lenses</button>
    <button class="cat-tab" onclick="setCatActive(this,'Sunglasses')">🕶️ Sunglasses</button>
    <button class="cat-tab" onclick="setCatActive(this,'Accessories')">🏷️ Accessories</button>
    <button class="cat-tab" onclick="setCatActive(this,'Eye Drops')">💧 Eye Drops</button>
  </div>

  <div class="footer-space"></div>
</div>

<script>
  function toggleProducts() {
    const subbar = document.getElementById('productsSubbar');
    const chev = document.getElementById('productsChev');
    subbar.classList.toggle('open');
    chev.classList.toggle('open');
    chev.classList.toggle('closed');
    if (!subbar.classList.contains('open')) {
      document.getElementById('categoriesRow').classList.remove('open');
    }
  }

  function toggleCategories(el) {
    const row = document.getElementById('categoriesRow');
    row.classList.toggle('open');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    if (row.classList.contains('open')) el.classList.add('active');
    console.log('Categories open:', row.classList.contains('open'));
  }

  function setActive(el, name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('categoriesRow').classList.remove('open');
    console.log('Active section:', name);
  }

  function setCatActive(el, name) {
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    console.log('Active category:', name);
  }
</script>

</body>
</html>
